[package]
name = "pulse-core"
version = "0.1.0"
description = "Pulse IDE native shell"
authors = ["Pulse IDE Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pulse_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
